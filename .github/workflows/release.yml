name: Release

# Push a version tag (e.g. v1.0.0) to build the portable exe + the installer and
# publish a GitHub release. Main pushes themselves only run CI.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release + upload the asset

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install web dependencies
        working-directory: src/web
        run: npm ci

      - name: Web tests (Vitest)
        working-directory: src/web
        run: npm test

      - name: Build web (typecheck + bundle into wwwroot)
        working-directory: src/web
        run: npm run build

      - name: .NET tests (gate the release)
        run: dotnet test SyncSentinel.slnx -c Release

      # The version is the tag without its leading "v" (e.g. v0.5.0 -> 0.5.0). Used
      # to stamp the assembly (shown in-app) and to version the installer.
      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: "echo \"version=$('${{ github.ref_name }}' -replace '^v','')\" >> $env:GITHUB_OUTPUT"

      # Portable artifact: one self-contained file, no install (self-extracts at startup).
      - name: Publish portable single-file exe
        run: dotnet publish src/SyncSentinel -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o publish

      # Installer payload: a normal multi-file self-contained build (no single-file
      # self-extraction, so the installed app starts faster). Inno packs publish-app.
      - name: Publish multi-file build (installer payload)
        run: dotnet publish src/SyncSentinel -c Release -r win-x64 --self-contained -p:Version=${{ steps.ver.outputs.version }} -o publish-app

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # The .iss defaults (PayloadDir=..\publish-app, OutputDir=.) resolve relative to
      # installer\, so this packs ..\publish-app and writes installer\SyncSentinel-Setup.exe.
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\SyncSentinel.iss'

      # NetSparkle verifies both the appcast and installer with the stable
      # Ed25519 public key compiled into the app. The private key exists only as
      # a GitHub Actions secret and is never written to the repository.
      - name: Create signed update feed
        shell: pwsh
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: nEDaY7ezIENToBpyirIB7a/EK+LTwW8qBUvF7WOjxzM=
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SPARKLE_PRIVATE_KEY)) {
            throw 'The SPARKLE_PRIVATE_KEY repository secret is required to publish updates.'
          }
          dotnet tool install NetSparkleUpdater.Tools.AppCastGenerator --version 2.9.0 --tool-path .tools
          New-Item -ItemType Directory -Force release-feed | Out-Null
          .\.tools\netsparkle-generate-appcast.exe `
            --single-file installer\SyncSentinel-Setup.exe `
            --file-version ${{ steps.ver.outputs.version }} `
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" `
            --appcast-output-directory release-feed `
            --link-tag "https://github.com/${{ github.repository }}/releases" `
            --product-name SyncSentinel `
            --human-readable true
          if (-not (Test-Path release-feed\appcast.xml) -or -not (Test-Path release-feed\appcast.xml.signature)) {
            throw 'The signed NetSparkle appcast was not generated.'
          }
          if (-not (Select-String -Quiet -SimpleMatch 'sparkle:signature=' release-feed\appcast.xml)) {
            throw 'The installer entry in appcast.xml is unsigned.'
          }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "publish/SyncSentinel.exe" "installer/SyncSentinel-Setup.exe" "release-feed/appcast.xml" "release-feed/appcast.xml.signature" --title "SyncSentinel ${{ github.ref_name }}" --generate-notes
