name: Release

# Push a version tag (e.g. v1.0.0) to build the portable exe + the installer and
# publish a GitHub release. Main pushes themselves only run CI.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release + upload the asset

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install web dependencies
        working-directory: src/web
        run: npm ci

      - name: Web tests (Vitest)
        working-directory: src/web
        run: npm test

      - name: Build web (typecheck + bundle into wwwroot)
        working-directory: src/web
        run: npm run build

      - name: .NET tests (gate the release)
        run: dotnet test SyncSentinel.slnx -c Release

      # The version is the tag without its leading "v" (e.g. v0.5.0 -> 0.5.0). Used
      # to stamp the assembly (shown in-app) and to version the installer.
      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: "echo \"version=$('${{ github.ref_name }}' -replace '^v','')\" >> $env:GITHUB_OUTPUT"

      # Portable artifact: one self-contained file, no install (self-extracts at startup).
      - name: Publish portable single-file exe
        run: dotnet publish src/SyncSentinel -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o publish

      # Installer payload: a normal multi-file self-contained build (no single-file
      # self-extraction, so the installed app starts faster). Inno packs publish-app.
      - name: Publish multi-file build (installer payload)
        run: dotnet publish src/SyncSentinel -c Release -r win-x64 --self-contained -p:Version=${{ steps.ver.outputs.version }} -o publish-app

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # The .iss defaults (PayloadDir=..\publish-app, OutputDir=.) resolve relative to
      # installer\, so this packs ..\publish-app and writes installer\SyncSentinel-Setup.exe.
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\SyncSentinel.iss
          if ($LASTEXITCODE -ne 0) {
            throw 'Inno Setup could not build the installer.'
          }
          $installerVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo('installer\SyncSentinel-Setup.exe').ProductVersion
          .\.github\scripts\Assert-ReleaseVersion.ps1 `
            -ActualVersion $installerVersion `
            -ExpectedVersion '${{ steps.ver.outputs.version }}' `
            -ArtifactName 'The compiled installer'

      # Restore the last stable feed and the authoritative Markdown for each
      # historical item. Embedding Markdown avoids rendering the GitHub website
      # (navigation, sign-in controls, and all) inside the updater dialog.
      - name: Restore previous release history
        id: previous_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force release-feed | Out-Null
          New-Item -ItemType Directory -Force release-notes | Out-Null
          $releases = @(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not determine the previous stable release.'
          }
          if ($releases.Count -eq 0) {
            exit 0
          }
          $previousTag = $releases[0].tagName
          "tag=$previousTag" >> $env:GITHUB_OUTPUT
          gh release download $previousTag --pattern appcast.xml --dir release-feed --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "The previous stable release $previousTag has no downloadable appcast."
          }

          [xml] $previousFeed = Get-Content release-feed\appcast.xml -Raw
          $sparkle = 'http://www.andymatuschak.org/xml-namespaces/sparkle'
          $ns = [System.Xml.XmlNamespaceManager]::new($previousFeed.NameTable)
          $ns.AddNamespace('sparkle', $sparkle)
          foreach ($item in @($previousFeed.SelectNodes('/rss/channel/item'))) {
            $version = $item.SelectSingleNode('sparkle:version', $ns).InnerText.Trim()
            $body = gh release view "v$version" --json body --jq .body
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($body)) {
              throw "Could not restore release notes for v$version."
            }
            $body | Set-Content -Encoding utf8NoBOM "release-notes/$version.md"
          }

      # Generate authoritative notes against the previous published release,
      # not merely the previous tag (which may belong to a failed release run).
      - name: Generate release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $parameters = @{
            tag_name = '${{ github.ref_name }}'
            target_commitish = '${{ github.sha }}'
          }
          $previousTag = '${{ steps.previous_release.outputs.tag }}'
          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
            $parameters.previous_tag_name = $previousTag
          }
          $arguments = @('--method', 'POST', 'repos/${{ github.repository }}/releases/generate-notes')
          foreach ($entry in $parameters.GetEnumerator()) {
            $arguments += @('-f', "$($entry.Key)=$($entry.Value)")
          }
          $notes = gh api @arguments | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($notes.body)) {
            throw 'GitHub generated an empty release changelog.'
          }
          $notes.body | Set-Content -Encoding utf8NoBOM "release-notes/${{ steps.ver.outputs.version }}.md"

      # NetSparkle verifies both the appcast and installer with the stable
      # Ed25519 public key compiled into the app. The private key exists only as
      # a GitHub Actions secret and is never written to the repository.
      - name: Create signed update feed
        shell: pwsh
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: nEDaY7ezIENToBpyirIB7a/EK+LTwW8qBUvF7WOjxzM=
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SPARKLE_PRIVATE_KEY)) {
            throw 'The SPARKLE_PRIVATE_KEY repository secret is required to publish updates.'
          }
          foreach ($executable in @('publish\SyncSentinel.exe', 'publish-app\SyncSentinel.exe')) {
            $productVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($executable).ProductVersion
            .\.github\scripts\Assert-ReleaseVersion.ps1 `
              -ActualVersion $productVersion `
              -ExpectedVersion '${{ steps.ver.outputs.version }}' `
              -ArtifactName $executable
          }
          dotnet tool install NetSparkleUpdater.Tools.AppCastGenerator --version 2.9.0 --tool-path .tools
          .\.github\scripts\Build-ReleaseFeed.ps1 `
            -GeneratorPath .\.tools\netsparkle-generate-appcast.exe `
            -InstallerPath installer\SyncSentinel-Setup.exe `
            -FeedDirectory release-feed `
            -ChangeLogDirectory release-notes `
            -Version '${{ steps.ver.outputs.version }}' `
            -BaseUrl 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}' `
            -LatestAppcastUrl 'https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml' `
            -RepositoryUrl 'https://github.com/${{ github.repository }}'

          [xml] $appcast = Get-Content release-feed\appcast.xml -Raw
          $sparkle = 'http://www.andymatuschak.org/xml-namespaces/sparkle'
          $ns = [System.Xml.XmlNamespaceManager]::new($appcast.NameTable)
          $ns.AddNamespace('sparkle', $sparkle)
          $installerSignature = $appcast.SelectSingleNode('/rss/channel/item[1]/enclosure', $ns).GetAttribute('signature', $sparkle)
          $installerVerification = @(.\.tools\netsparkle-generate-appcast.exe `
            --verify installer\SyncSentinel-Setup.exe --signature $installerSignature)
          if ('Signature valid' -notin $installerVerification) {
            throw 'The current installer signature failed Ed25519 verification.'
          }
          $appcastSignature = (Get-Content release-feed\appcast.xml.signature -Raw).Trim()
          $appcastVerification = @(.\.tools\netsparkle-generate-appcast.exe `
            --verify release-feed\appcast.xml --signature $appcastSignature)
          if ('Signature valid' -notin $appcastVerification) {
            throw 'The detached appcast signature failed Ed25519 verification.'
          }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "publish/SyncSentinel.exe" "installer/SyncSentinel-Setup.exe" "release-feed/appcast.xml" "release-feed/appcast.xml.signature" --title "SyncSentinel ${{ github.ref_name }}" --notes-file "release-notes/${{ steps.ver.outputs.version }}.md"
